<div class="container my-5 fade-in">
    <!-- Loading overlay -->
    <div *ngIf="loading" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="background-color: rgba(255, 255, 255, 0.9); z-index: 9999;">
        <div class="text-center">
            <div class="spinner-border text-primary border-3 mb-3" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h5 class="text-primary fw-bold">Resetting Password...</h5>
        </div>
    </div>

    <div class="row justify-content-center align-items-center min-vh-75 mt-4">
        <div class="col-md-8 col-lg-5">
            <div class="modern-card p-4 p-md-5 border-0 shadow-lg">
                <form (ngSubmit)="resetPassword()" #resetForm="ngForm">
                    <div class="text-center mb-5">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="fa-solid fa-key fs-3"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-2">Reset Password</h2>
                        <p class="text-muted">Enter your new reliable password below</p>
                    </div>

                    <div class="mb-4">
                        <label for="newPassword" class="form-label fw-semibold text-dark">New Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg bg-light border-start-0 ps-0" id="newPassword" [(ngModel)]="newPassword"
                            name="newPassword" required minlength="6" #newPasswordRef="ngModel" placeholder="••••••••" />
                        </div>
                        <div *ngIf="newPasswordRef.invalid && newPasswordRef.touched" class="text-danger small mt-2 fw-semibold fade-in">
                            <i class="fa-solid fa-circle-exclamation me-1"></i>Password must be at least 6 characters
                        </div>
                    </div>

                    <div class="mb-4 mt-5">
                        <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm py-3" type="submit" [disabled]="resetForm.invalid">
                            Update Password
                        </button>
                    </div>

                    <div class="text-center mt-4 pt-4 border-top">
                        <a routerLink="/user-auth" class="btn btn-link text-decoration-none text-muted fw-semibold">
                            <i class="fa-solid fa-arrow-left me-2"></i>Back to login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
