<div class="container my-5 fade-in">
    <!-- Loading overlay -->
    <div *ngIf="loading" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="background-color: rgba(255, 255, 255, 0.9); z-index: 9999;">
        <div class="text-center">
            <div class="spinner-border text-primary border-3 mb-3" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h5 class="text-primary fw-bold">Authenticating...</h5>
        </div>
    </div>

    <div class="row justify-content-center align-items-center min-vh-75 mt-4">
        <div class="col-md-8 col-lg-5">
            <div class="modern-card p-4 p-md-5 border-0 shadow-lg">
                <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
                    <div class="text-center mb-5">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="fa-solid fa-user-lock fs-3"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-2">Welcome Back</h2>
                        <p class="text-muted">Please sign in to your account</p>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold text-dark">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" class="form-control form-control-lg bg-light border-start-0 ps-0" name="email" id="email" formControlName="email" placeholder="name@example.com">
                        </div>
                        <div *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched" class="text-danger small mt-2 fw-semibold fade-in">
                            <i class="fa-solid fa-circle-exclamation me-1"></i>Please enter a valid email
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label for="password" class="form-label fw-semibold text-dark mb-0">Password</label>
                            <a class="text-primary text-decoration-none small fw-semibold cursor-pointer" (click)="passwordReset()">Forgot Password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control form-control-lg bg-light border-start-0 ps-0" name="password" id="password" formControlName="password" placeholder="••••••••">
                        </div>
                        <div *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched" class="text-danger small mt-2 fw-semibold fade-in">
                            <i class="fa-solid fa-circle-exclamation me-1"></i>Password is required
                        </div>
                    </div>

                    <div class="mb-4 mt-5">
                        <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm py-3" type="submit" [disabled]="userForm.invalid">Sign In</button>
                    </div>

                    <div class="d-flex align-items-center my-4">
                        <hr class="flex-grow-1 text-muted opacity-25">
                        <span class="mx-3 text-muted small fw-semibold">OR CONTINUE WITH</span>
                        <hr class="flex-grow-1 text-muted opacity-25">
                    </div>

                    <div class="d-flex flex-column gap-3 mb-4">
                        <button type="button" class="btn btn-outline-dark btn-lg w-100 rounded-pill d-flex align-items-center justify-content-center border-2 gap-3 fw-semibold" (click)="signInWithGoogle()">
                            <img src="https://cdn-icons-png.flaticon.com/256/720/720255.png" style="width: 24px; height: 24px;" alt="Google Logo">
                            Log in with Google
                        </button>
                        
                        <button type="button" class="btn btn-outline-primary btn-lg w-100 rounded-pill d-flex align-items-center justify-content-center border-2 gap-3 fw-semibold border-opacity-75" style="color: #1877F2; border-color: #1877F2;">
                            <i class="fa-brands fa-facebook fs-4"></i>
                            Log in with Facebook
                        </button>
                    </div>

                    <div class="text-center mt-4 pt-4 border-top">
                        <p class="text-muted mb-0">Don't have an account? <a href="javascript:void(0)" routerLink="/create" class="text-primary fw-bold text-decoration-none ms-1">Sign up now</a></p>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
