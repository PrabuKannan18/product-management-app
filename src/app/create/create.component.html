<div class="container my-5 fade-in">
    <!-- Loading overlay -->
    <div *ngIf="loading" class="position-fixed top-0 start-0 w-100 h-100 d-flex justify-content-center align-items-center" style="background-color: rgba(255, 255, 255, 0.9); z-index: 9999;">
        <div class="text-center">
            <div class="spinner-border text-primary border-3 mb-3" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h5 class="text-primary fw-bold">Creating account...</h5>
        </div>
    </div>

    <div class="row justify-content-center align-items-center min-vh-75 mt-4">
        <div class="col-md-8 col-lg-5">
            <div class="modern-card p-4 p-md-5 border-0 shadow-lg">
                <form #contactForm="ngForm" (ngSubmit)="onSubmit(contactForm)">
                    <div class="text-center mb-5">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 60px; height: 60px;">
                            <i class="fa-solid fa-user-plus fs-3"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-2">Create Account</h2>
                        <p class="text-muted">Join us to shop for premium tech products</p>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fa-regular fa-envelope"></i></span>
                            <input type="email" id="email" name="email" class="form-control form-control-lg bg-light border-start-0 ps-0" [(ngModel)]="model.email" #email="ngModel" required placeholder="name@example.com">
                        </div>
                        <div *ngIf="email.invalid && email.touched" class="text-danger small mt-2 fw-semibold fade-in">
                            <i class="fa-solid fa-circle-exclamation me-1"></i>Email is required
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-dark">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="password" name="password" class="form-control form-control-lg bg-light border-start-0 ps-0" [(ngModel)]="model.password" #password="ngModel" required placeholder="Create a strong password">
                        </div>
                        <div *ngIf="password.invalid && password.touched" class="text-danger small mt-2 fw-semibold fade-in">
                            <i class="fa-solid fa-circle-exclamation me-1"></i>Password is required
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="cpassword" class="form-label fw-semibold text-dark">Confirm Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted px-3"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="cpassword" name="cpassword" class="form-control form-control-lg bg-light border-start-0 ps-0" [(ngModel)]="model.cpassword" #cpassword="ngModel" required placeholder="Re-enter your password">
                        </div>
                        <div *ngIf="cpassword.invalid && cpassword.touched" class="text-danger small mt-2 fw-semibold fade-in">
                            <i class="fa-solid fa-circle-exclamation me-1"></i>Confirm Password is required
                        </div>
                    </div>

                    <!-- Additional UI improvement for Terms checking -->
                    <div class="mb-4 mt-4 form-check">
                        <input type="checkbox" class="form-check-input mt-1" id="terms" required>
                        <label class="form-check-label text-muted small" for="terms">
                            I agree to the <a href="javascript:void(0)" class="text-primary text-decoration-none fw-semibold">Terms of Service</a> and <a href="javascript:void(0)" class="text-primary text-decoration-none fw-semibold">Privacy Policy</a>
                        </label>
                    </div>

                    <div class="mb-4 mt-4">
                        <button class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm py-3" type="submit" [disabled]="contactForm.invalid" >Sign Up</button>
                    </div>

                    <div class="text-center mt-4 pt-4 border-top">
                        <p class="text-muted mb-0">Already have an account? <a href="javascript:void(0)" routerLink="/user-auth" class="text-primary fw-bold text-decoration-none ms-1">Log in here</a></p>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
