<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container container-fluid">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <i class="fa-solid fa-cube me-2 fs-3"></i>
      <span>GadgetHub</span>
    </a>

    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" routerLink="/products" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Products</a>
        </li>
        <li class="nav-item" *ngIf="user">
          <a class="nav-link" routerLink="/add-product" routerLinkActive="active"><i class="fa-solid fa-plus me-1"></i>Add Product</a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <!-- Wishlist -->
        <a routerLink="/wishlist" class="nav-link position-relative d-flex align-items-center" *ngIf="user" title="Wishlist">
          <i class="fa-solid fa-heart fs-5 text-danger"></i>
        </a>

        <!-- Cart -->
        <a routerLink="/cart" class="nav-link position-relative d-flex align-items-center ms-2" title="Cart">
          <i class="fa-solid fa-cart-shopping fs-5"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-primary border border-2 border-white" style="transform: translate(-30%, -30%) !important;">
            {{ cartItemCount }}
          </span>
        </a>

        <div class="vr mx-2 d-none d-lg-block"></div>

        <!-- User Menu -->
        <div *ngIf="user; else loginLink" class="nav-item dropdown">
          <button class="btn btn-light rounded-pill px-3 py-1 dropdown-toggle d-flex align-items-center gap-2 border shadow-sm" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa-solid fa-circle-user text-primary fs-5"></i>
            <span class="small fw-semibold text-dark">{{ user.email.split('@')[0] }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2 rounded-3">
            <li><a class="dropdown-item py-2 fw-semibold" routerLink="/profile"><i class="fa-solid fa-user me-2 text-muted"></i>Profile</a></li>
            <li><a class="dropdown-item py-2 fw-semibold" routerLink="/orders"><i class="fa-solid fa-box me-2 text-muted"></i>My Orders</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item py-2 fw-semibold text-danger" (click)="logout()"><i class="fa-solid fa-right-from-bracket me-2"></i>Log Out</button></li>
          </ul>
        </div>

        <ng-template #loginLink>
          <a class="btn btn-primary px-4 rounded-pill d-flex align-items-center gap-2 shadow-sm" routerLink="/user-auth">
            <i class="fa-solid fa-user"></i> Log In
          </a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <router-outlet></router-outlet>
</main>
