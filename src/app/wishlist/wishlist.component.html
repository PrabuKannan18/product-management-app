<div class="container my-5 fade-in">
  <div class="d-flex justify-content-between align-items-center mb-5 border-bottom pb-4">
    <div>
      <h2 class="display-6 fw-bold text-dark mb-1">My Wishlist</h2>
      <p class="text-muted mb-0">Products you've saved for later</p>
    </div>
    <a routerLink="/products" class="btn btn-outline-primary rounded-pill px-4">
      <i class="fa-solid fa-arrow-left me-2"></i>Browse Products
    </a>
  </div>

  <!-- Loading -->
  <div class="text-center py-5" *ngIf="loading">
    <div class="spinner-border text-primary mb-3" style="width:3rem;height:3rem;" role="status"></div>
    <h5 class="text-muted">Loading wishlist...</h5>
  </div>

  <!-- Empty State -->
  <div class="text-center py-5 my-3" *ngIf="!loading && products.length === 0">
    <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-4" style="width:100px;height:100px;">
      <i class="fa-regular fa-heart fs-1 text-muted"></i>
    </div>
    <h4 class="fw-bold mb-2">Your wishlist is empty</h4>
    <p class="text-muted mb-4">Click the heart icon on any product to save it here.</p>
    <a routerLink="/products" class="btn btn-primary rounded-pill px-5">Discover Products</a>
  </div>

  <!-- Wishlist Grid -->
  <div class="row g-4" *ngIf="!loading && products.length > 0">
    <div class="col-12 col-sm-6 col-md-4 col-xl-3" *ngFor="let product of products">
      <div class="modern-card bg-white h-100 p-3 d-flex flex-column position-relative" (click)="$event.stopPropagation()">
        <!-- Remove button -->
        <button class="btn position-absolute top-0 end-0 m-2 btn-light rounded-circle shadow-sm d-flex align-items-center justify-content-center border-0"
          style="width:36px;height:36px;z-index:2;"
          (click)="removeFromWishlist(product)"
          title="Remove from wishlist">
          <i class="fa-solid fa-heart text-danger"></i>
        </button>

        <!-- Image -->
        <a [routerLink]="['/product', product.id]" class="text-decoration-none">
          <div class="rounded-3 overflow-hidden bg-light img-placeholder mb-3" style="height:190px;">
            <img [src]="product.imageUrl" class="w-100 h-100 object-fit-contain p-3" [alt]="product.name">
          </div>

          <div class="px-1">
            <h6 class="fw-bold text-dark text-truncate mb-1">{{ product.name }}</h6>
            <p class="text-muted small text-truncate mb-3">{{ product.description }}</p>
          </div>
        </a>

        <div class="px-1 mt-auto">
          <div class="d-flex justify-content-between align-items-center mt-2">
            <span class="h5 fw-bolder text-primary mb-0">${{ product.price }}</span>
            <button class="btn btn-primary btn-sm rounded-pill px-3 fw-bold shadow-sm"
              (click)="addToCart($event, product)"
              [disabled]="product.quantity === 0">
              <i class="fa-solid fa-cart-plus me-1"></i>
              {{ product.quantity === 0 ? 'Sold Out' : 'Add to Cart' }}
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
